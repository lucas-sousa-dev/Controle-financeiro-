<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro Pessoal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Controle Financeiro Pessoal</h1>
    <p>Organize suas receitas e despesas.</p>

    <section>
      <h2>Resumo financeiro</h2>
      <p>Receitas: <span id="receitas">R$ 0,00</span></p>
      <p>Despesas: <span id="despesas">R$ 0,00</span></p>
      <p>Saldo: <span id="saldo">R$ 0,00</span></p>
    </section>

    <section>
      <h2>Nova movimentação</h2>
      <form id="formulario">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" required>

        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" min="0.01" step="0.01" required>

        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>

        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section>
      <h2>Movimentações</h2>
      <ul id="lista-movimentacoes"></ul>
    </section>
  </main>
</body>
</html>
